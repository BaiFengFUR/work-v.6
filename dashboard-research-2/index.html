<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研究2：图表联动</title>
  <link rel="icon" href="data:,">
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 380px; }
    #status { display: none; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">独立研究2：ECharts 与 Chart.js 图表联动</h1>
    <p class="text-muted">点击左图某个月份的柱子，右图折线图会自动高亮该月数据；再次点击同一月或点击空白处取消。</p>
  </header>

  <p id="status" class="alert alert-warning"></p>
  <p id="pick-info" class="alert alert-info" style="display:none;"></p>

  <section class="row g-3 mb-4" id="cards"></section>

  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">各月借阅量（ECharts柱状图）</h2>
      <div id="bar-chart" class="chart-box border rounded"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">借阅趋势（Chart.js折线图）</h2>
      <div class="chart-box border rounded p-1"><canvas id="line-chart"></canvas></div>
    </div>
  </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>

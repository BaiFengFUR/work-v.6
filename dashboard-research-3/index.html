<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研究3：误导图表修复</title>
  <link rel="icon" href="data:,">
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 360px; }
    #status { display: none; }
    .bad-box { border: 2px solid #dc3545; border-radius: .5rem; }
    .good-box { border: 2px solid #198754; border-radius: .5rem; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">独立研究3：误导性图表修复案例</h1>
    <p class="text-muted">同一组数据（课程统一数据集·文学类12个月借阅量），左图截断纵轴制造误导，右图为诚实版本。</p>
  </header>

  <p id="status" class="alert alert-warning"></p>

  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5 text-danger">误导版：纵轴从 200 册开始</h2>
      <div id="bad-chart" class="chart-box bad-box p-1"></div>
      <p class="small text-muted mt-1">3 月（352 册）与 11 月（437 册）实际只差 24%，在这张图上柱高却相差约 56%，季节波动被夸大。</p>
    </div>
    <div class="col-lg-6">
      <h2 class="h5 text-success">诚实版：纵轴从 0 开始</h2>
      <div id="good-chart" class="chart-box good-box p-1"></div>
      <p class="small text-muted mt-1">柱长之比等于数值之比，可见真实波动只有约 24%。</p>
    </div>
  </section>

  <section class="card mt-4">
    <div class="card-body">
      <h2 class="h6">案例与分析（约200字）</h2>
      <p id="analysis" class="small mb-2"></p>
    </div>
  </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研究1：Promise.all 并行加载</title>
  <link rel="icon" href="data:,">
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    #status { display: none; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">独立研究1：Promise.all 并行请求</h1>
    <p class="text-muted">两份 JSON（books.json + studyrooms.json）同时加载，并对比并行与串行的总耗时</p>
  </header>

  <p id="status" class="alert alert-warning"></p>

  <section class="row g-3 mb-3" id="summary"></section>

  <section class="card mb-4">
    <div class="card-body">
      <h2 class="h5">耗时对比实验</h2>
      <div class="d-flex gap-2 flex-wrap">
        <button id="btn-real" class="btn btn-primary btn-sm">真实测量</button>
        <button id="btn-mock" class="btn btn-outline-primary btn-sm">模拟慢网络</button>
      </div>
      <div class="table-responsive mt-3">
        <table class="table table-sm table-bordered align-middle mb-0">
          <thead class="table-light">
            <tr><th>方式</th><th>各轮耗时(ms)</th><th>平均(ms)</th><th>结论</th></tr>
          </thead>
          <tbody>
            <tr><td>并行 Promise.all</td><td id="real-parallel-rounds">—</td><td id="real-parallel-avg">—</td><td id="real-conclusion" rowspan="2">点按钮开始</td></tr>
            <tr><td>串行 两次await</td><td id="real-serial-rounds">—</td><td id="real-serial-avg">—</td></tr>
            <tr class="table-secondary"><td>并行（模拟延迟）</td><td id="mock-parallel-rounds">—</td><td id="mock-parallel-avg">—</td><td id="mock-conclusion" rowspan="2">—</td></tr>
            <tr class="table-secondary"><td>串行（模拟延迟）</td><td id="mock-serial-rounds">—</td><td id="mock-serial-avg">—</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">借阅数据（第1份JSON）</h2>
      <ul id="book-list" class="list-group"></ul>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">自习室数据（第2份JSON）</h2>
      <ul id="room-list" class="list-group"></ul>
    </div>
  </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
